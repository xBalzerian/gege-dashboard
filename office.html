<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office · Gege Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
        
        .app { display: grid; grid-template-columns: 260px 1fr; }
        .sidebar { background: rgba(20,20,28,0.9); border-right: 1px solid rgba(255,255,255,0.06); padding: 24px 20px; position: fixed; left: 0; top: 0; bottom: 0; width: 260px; }
        .main { margin-left: 260px; padding: 32px; }
        
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .brand-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #ff6b9d, #ff8fab); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .brand-text { font-size: 1.5rem; font-weight: 700; }
        
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; color: #888; text-decoration: none; margin-bottom: 4px; transition: all 0.2s; }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .nav-item.active { background: rgba(255,107,157,0.15); color: #ffb3c1; }
        
        .header { margin-bottom: 32px; }
        .header-title { font-size: 1.75rem; font-weight: 700; }
        
        .office-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        
        .workspace {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            transition: all 0.2s;
        }
        
        .workspace:hover { border-color: rgba(255,107,157,0.2); }
        .workspace-name { font-size: 1.125rem; font-weight: 600; margin-bottom: 4px; }
        .workspace-role { color: #888; font-size: 0.875rem; margin-bottom: 20px; }
        
        .workspace-desk {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .monitor {
            width: 80px;
            height: 60px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            position: relative;
        }
        
        .monitor::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 0 0 4px 4px;
        }
        
        .screen {
            position: absolute;
            inset: 4px;
            background: linear-gradient(180deg, rgba(255,107,157,0.4), rgba(255,107,157,0.1));
            border-radius: 4px;
            animation: glow 2s ease-in-out infinite;
        }
        
        .screen.off { animation: none; opacity: 0.3; }
        
        @keyframes glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        .workspace-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 0.8125rem;
            padding: 8px 16px;
            border-radius: 100px;
        }
        
        .status-online { color: #00d9a3; background: rgba(0,217,163,0.1); }
        .status-offline { color: #888; background: rgba(255,255,255,0.05); }
        
        @media (max-width: 1200px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
            .office-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🌸</div>
                <div class="brand-text">Gege</div>
            </div>
            <a href="index.html" class="nav-item">📊 Dashboard</a>
            <a href="tasks.html" class="nav-item">✓ Tasks</a>
            <a href="content.html" class="nav-item">📝 Content</a>
            <a href="calendar.html" class="nav-item">📅 Calendar</a>
            <a href="memory.html" class="nav-item">🧠 Memory</a>
            <a href="team.html" class="nav-item">👥 Team</a>
            <a href="office.html" class="nav-item active">🏢 Office</a>
        </aside>

        <main class="main">
            <div class="header">
                <h1 class="header-title">Office</h1>
            </div>

            <div class="office-grid">
                <div class="workspace">
                    <div class="workspace-name">Gege</div>
                    <div class="workspace-role">General Assistant</div>
                    <div class="workspace-desk">
                        <div class="monitor"><div class="screen"></div></div>
                    </div>
                    <div class="workspace-status status-online">● Working</div>
                </div>

                <div class="workspace">
                    <div class="workspace-name">Writer</div>
                    <div class="workspace-role">Content Creation</div>
                    <div class="workspace-desk">
                        <div class="monitor"><div class="screen off"></div></div>
                    </div>
                    <div class="workspace-status status-offline">○ Waiting</div>
                </div>

                <div class="workspace">
                    <div class="workspace-name">Designer</div>
                    <div class="workspace-role">Image Generation</div>
                    <div class="workspace-desk">
                        <div class="monitor"><div class="screen off"></div></div>
                    </div>
                    <div class="workspace-status status-offline">○ Waiting</div>
                </div>

                <div class="workspace">
                    <div class="workspace-name">SEO</div>
                    <div class="workspace-role">Optimization</div>
                    <div class="workspace-desk">
                        <div class="monitor"><div class="screen off"></div></div>
                    </div>
                    <div class="workspace-status status-offline">○ Waiting</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
