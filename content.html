<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content · Gege Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
        
        .app { display: grid; grid-template-columns: 260px 1fr; }
        .sidebar { background: rgba(20,20,28,0.9); border-right: 1px solid rgba(255,255,255,0.06); padding: 24px 20px; position: fixed; left: 0; top: 0; bottom: 0; width: 260px; }
        .main { margin-left: 260px; padding: 32px; }
        
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .brand-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #ff6b9d, #ff8fab); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .brand-text { font-size: 1.5rem; font-weight: 700; }
        
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; color: #888; text-decoration: none; margin-bottom: 4px; transition: all 0.2s; }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .nav-item.active { background: rgba(255,107,157,0.15); color: #ffb3c1; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header-title { font-size: 1.75rem; font-weight: 700; }
        
        .btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 20px; border-radius: 100px; font-size: 0.875rem; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #ff6b9d; border-color: #ff6b9d; }
        
        /* Pipeline */
        .pipeline { display: flex; gap: 24px; overflow-x: auto; padding-bottom: 16px; }
        
        .pipeline-stage {
            min-width: 320px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 20px;
        }
        
        .stage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .stage-title { font-size: 0.9375rem; font-weight: 600; }
        .stage-count { background: rgba(255,255,255,0.05); color: #888; font-size: 0.75rem; padding: 4px 12px; border-radius: 100px; font-weight: 600; }
        
        .content-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        
        .content-card:hover { border-color: rgba(255,107,157,0.2); }
        .content-title { font-weight: 600; margin-bottom: 8px; }
        .content-meta { color: #888; font-size: 0.875rem; }
        
        @media (max-width: 1200px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🌸</div>
                <div class="brand-text">Gege</div>
            </div>
            <a href="index.html" class="nav-item">📊 Dashboard</a>
            <a href="tasks.html" class="nav-item">✓ Tasks</a>
            <a href="content.html" class="nav-item active">📝 Content</a>
            <a href="calendar.html" class="nav-item">📅 Calendar</a>
            <a href="memory.html" class="nav-item">🧠 Memory</a>
            <a href="team.html" class="nav-item">👥 Team</a>
            <a href="office.html" class="nav-item">🏢 Office</a>
        </aside>

        <main class="main">
            <div class="header">
                <h1 class="header-title">Content Pipeline</h1>
                <button class="btn">+ New Idea</button>
            </div>

            <div class="pipeline">
                <div class="pipeline-stage">
                    <div class="stage-header">
                        <span class="stage-title">💡 Ideas</span>
                        <span class="stage-count">2</span>
                    </div>
                    <div class="content-card">
                        <div class="content-title">Travel Booking Site Guide</div>
                        <div class="content-meta">Blog Post · Travel</div>
                    </div>
                    <div class="content-card">
                        <div class="content-title">Agent Automation Tutorial</div>
                        <div class="content-meta">Video Script · Tech</div>
                    </div>
                </div>

                <div class="pipeline-stage">
                    <div class="stage-header">
                        <span class="stage-title">📝 Writing</span>
                        <span class="stage-count">1</span>
                    </div>
                    <div class="content-card">
                        <div class="content-title">Mission Control Setup</div>
                        <div class="content-meta">Blog Post · Tech</div>
                    </div>
                </div>

                <div class="pipeline-stage">
                    <div class="stage-header">
                        <span class="stage-title">📤 Published</span>
                        <span class="stage-count">1</span>
                    </div>
                    <div class="content-card">
                        <div class="content-title">Parr Fashion Theme</div>
                        <div class="content-meta">Template · Design</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
