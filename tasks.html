<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks · Gege Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
        
        .app { display: grid; grid-template-columns: 260px 1fr; }
        .sidebar { background: rgba(20,20,28,0.9); border-right: 1px solid rgba(255,255,255,0.06); padding: 24px 20px; position: fixed; left: 0; top: 0; bottom: 0; width: 260px; }
        .main { margin-left: 260px; padding: 32px; }
        
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .brand-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #ff6b9d, #ff8fab); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .brand-text { font-size: 1.5rem; font-weight: 700; }
        
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; color: #888; text-decoration: none; margin-bottom: 4px; transition: all 0.2s; }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .nav-item.active { background: rgba(255,107,157,0.15); color: #ffb3c1; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header-title { font-size: 1.75rem; font-weight: 700; }
        
        .btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 20px; border-radius: 100px; font-size: 0.875rem; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #ff6b9d; border-color: #ff6b9d; }
        
        /* Task Board */
        .board { display: flex; gap: 24px; overflow-x: auto; padding-bottom: 16px; }
        
        .board-column {
            min-width: 300px;
            max-width: 320px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 20px;
        }
        
        .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .board-title { font-size: 0.9375rem; font-weight: 600; }
        .board-count { background: rgba(255,255,255,0.05); color: #888; font-size: 0.75rem; padding: 4px 12px; border-radius: 100px; font-weight: 600; }
        
        .task-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: grab;
            transition: all 0.2s;
        }
        
        .task-card:hover { border-color: rgba(255,107,157,0.3); transform: translateY(-2px); }
        .task-title { font-size: 0.9375rem; font-weight: 500; margin-bottom: 12px; }
        .task-meta { display: flex; align-items: center; gap: 8px; }
        .task-tag { padding: 4px 10px; border-radius: 100px; font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; }
        .tag-dev { background: rgba(0,184,255,0.15); color: #00b8ff; }
        .tag-design { background: rgba(255,107,157,0.15); color: #ff6b9d; }
        .task-avatar { width: 24px; height: 24px; border-radius: 50%; background: #ff6b9d; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: #000; }
        
        @media (max-width: 1200px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🌸</div>
                <div class="brand-text">Gege</div>
            </div>
            <a href="index.html" class="nav-item">📊 Dashboard</a>
            <a href="tasks.html" class="nav-item active">✓ Tasks</a>
            <a href="content.html" class="nav-item">📝 Content</a>
            <a href="calendar.html" class="nav-item">📅 Calendar</a>
            <a href="memory.html" class="nav-item">🧠 Memory</a>
            <a href="team.html" class="nav-item">👥 Team</a>
            <a href="office.html" class="nav-item">🏢 Office</a>
        </aside>

        <main class="main">
            <div class="header">
                <h1 class="header-title">Task Board</h1>
                <button class="btn">+ New Task</button>
            </div>

            <div class="board">
                <div class="board-column">
                    <div class="board-header">
                        <span class="board-title">📋 Backlog</span>
                        <span class="board-count">2</span>
                    </div>
                    <div class="task-card">
                        <div class="task-title">Research LiteAPI integration</div>
                        <div class="task-meta">
                            <span class="task-tag tag-dev">Dev</span>
                            <span class="task-avatar">G</span>
                        </div>
                    </div>
                    <div class="task-card">
                        <div class="task-title">Set up domain for travel site</div>
                        <div class="task-meta">
                            <span class="task-tag tag-dev">Dev</span>
                            <span class="task-avatar">B</span>
                        </div>
                    </div>
                </div>

                <div class="board-column">
                    <div class="board-header">
                        <span class="board-title">🔄 In Progress</span>
                        <span class="board-count">1</span>
                    </div>
                    <div class="task-card">
                        <div class="task-title">Build Mission Control Dashboard</div>
                        <div class="task-meta">
                            <span class="task-tag tag-design">Design</span>
                            <span class="task-avatar">G</span>
                        </div>
                    </div>
                </div>

                <div class="board-column">
                    <div class="board-header">
                        <span class="board-title">👀 Review</span>
                        <span class="board-count">0</span>
                    </div>
                </div>

                <div class="board-column">
                    <div class="board-header">
                        <span class="board-title">✅ Done</span>
                        <span class="board-count">3</span>
                    </div>
                    <div class="task-card">
                        <div class="task-title">Update Parr Theme</div>
                        <div class="task-meta">
                            <span class="task-tag tag-design">Design</span>
                            <span class="task-avatar">G</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
