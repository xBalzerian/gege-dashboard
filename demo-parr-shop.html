<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — Parr</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #D4653B;
            --dark: #1A1A1A;
            --light: #F5F5F5;
            --white: #FFFFFF;
            --gray: #666666;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--white);
            color: var(--dark);
            line-height: 1.6;
        }
        
        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            border-bottom: 1px solid #eee;
        }
        
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -1px;
            text-decoration: none;
            color: var(--dark);
        }
        
        .nav {
            display: flex;
            gap: 2.5rem;
        }
        
        .nav a {
            text-decoration: none;
            color: var(--dark);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        
        .nav a:hover, .nav a.active {
            color: var(--primary);
        }
        
        .cart-icon {
            position: relative;
        }
        
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--primary);
            color: white;
            font-size: 10px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Page Header */
        .page-header {
            padding: 10rem 3rem 4rem;
            background: var(--light);
            text-align: center;
        }
        
        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        /* Filters */
        .filters {
            padding: 2rem 3rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        
        .filter-btn {
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: 1px solid #ddd;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: var(--dark);
            color: var(--white);
            border-color: var(--dark);
        }
        
        /* Shop Grid */
        .shop {
            padding: 4rem 3rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }
        
        .product-card {
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .product-card:hover {
            transform: translateY(-8px);
        }
        
        .product-image {
            aspect-ratio: 3/4;
            background: #f5f5f5;
            overflow: hidden;
            margin-bottom: 1rem;
            position: relative;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        
        .product-card:hover .product-image img {
            transform: scale(1.05);
        }
        
        .product-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .product-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .product-price {
            color: var(--gray);
            font-size: 0.95rem;
        }
        
        .product-price .sale {
            color: var(--primary);
            font-weight: 600;
            margin-right: 0.5rem;
        }
        
        .product-price .original {
            text-decoration: line-through;
            color: #999;
        }
        
        /* Footer */
        .footer {
            padding: 4rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e5e5e5;
        }
        
        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .footer-nav {
            display: flex;
            gap: 2rem;
        }
        
        .footer-nav a {
            color: var(--gray);
            text-decoration: none;
            font-size: 0.875rem;
        }
        
        @media (max-width: 1024px) {
            .products-grid { grid-template-columns: repeat(3, 1fr); }
        }
        
        @media (max-width: 768px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); }
            .nav { display: none; }
            .filters { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="demo-parr.html" class="logo">PARR</a>
        <nav class="nav">
            <a href="demo-parr.html">Home</a>
            <a href="demo-parr-about.html">About</a>
            <a href="demo-parr-shop.html" class="active">Shop</a>
            <a href="demo-parr-blog.html">Blog</a>
            <a href="demo-parr-contact.html">Contact</a>
        </nav>
        <div class="cart-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>

    <section class="shop">

            </a>
            
            <a href="demo-parr-product.html" class="product-card">
                <div class="product-image">
                    <img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600" alt="Silk Dress">
                </div>
                <div class="product-name">Silk Midi Dress</div>
                <div class="product-price">$245</div>
            </a>
            
            <a href="demo-parr-product.html" class="product-card">
                <div class="product-image">
                    <span class="product-badge">Sale</span>
                    <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=600" alt="Wool Coat">
                </div>
                <div class="product-name">Wool Trench Coat</div>
                <div class="product-price">
                    <span class="sale">$299</span>

            <a href="demo-parr-product.html" class="product-card">
                <div class="product-image">

                </div>
                <div class="product-name">Structured Leather Bag</div>
                <div class="product-price">$320</div>
            </a>
            
            <a href="demo-parr-product.html" class="product-card">
                <div class="product-image">
                    <img src="https://images.unsplash.com/photo-1434389677669-e08b4cac3105?w=600" alt="Cashmere Sweater">
                </div>
                <div class="product-name">Cashmere Turtleneck</div>
                <div class="product-price">$165</div>
            </a>
            
            <a href="demo-parr-product.html" class="product-card">
                <div class="product-image">
                    <span class="product-badge">New</span>
                    <img src="https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=600" alt="Ankle Boots">
                </div>
                <div class="product-name">Leather Ankle Boots</div>
                <div class="product-price">$275</div>
            </a>
            
            <a href="demo-parr-product.html" class="product-card">
                <div class="product-image">
                    <img src="https://images.unsplash.com/photo-1582142306909-195724d33ffc?w=600" alt="Gold Necklace">
                </div>

                <div class="product-image">
                    <img src="https://images.unsplash.com/photo-1591561954557-26941169b49e?w=600" alt="Wide Leg Pants">
                </div>

        </div>
    </section>

    <footer class="footer">

        <nav class="footer-nav">

</body>
</html>
