<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar · Gege Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
        
        .app { display: grid; grid-template-columns: 260px 1fr; }
        .sidebar { background: rgba(20,20,28,0.9); border-right: 1px solid rgba(255,255,255,0.06); padding: 24px 20px; position: fixed; left: 0; top: 0; bottom: 0; width: 260px; }
        .main { margin-left: 260px; padding: 32px; }
        
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .brand-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #ff6b9d, #ff8fab); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .brand-text { font-size: 1.5rem; font-weight: 700; }
        
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; color: #888; text-decoration: none; margin-bottom: 4px; transition: all 0.2s; }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .nav-item.active { background: rgba(255,107,157,0.15); color: #ffb3c1; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header-title { font-size: 1.75rem; font-weight: 700; }
        
        .btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 20px; border-radius: 100px; font-size: 0.875rem; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #ff6b9d; border-color: #ff6b9d; }
        
        /* Calendar */
        .calendar-container { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 24px; padding: 24px; }
        
        .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 12px; }
        .cal-header-cell { text-align: center; font-size: 0.75rem; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 1px; padding: 12px 0; }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        
        .cal-day { aspect-ratio: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; min-height: 100px; transition: all 0.2s; }
        .cal-day:hover { border-color: rgba(255,107,157,0.3); }
        .cal-day.other { opacity: 0.3; }
        .cal-day.today { background: rgba(255,107,157,0.1); border-color: #ff6b9d; box-shadow: 0 0 20px rgba(255,107,157,0.2); }
        
        .cal-day-num { font-size: 0.9375rem; font-weight: 600; margin-bottom: 8px; }
        .cal-event { font-size: 0.6875rem; padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .ev-cron { background: rgba(0,217,163,0.15); color: #00d9a3; }
        .ev-task { background: rgba(255,107,157,0.15); color: #ff6b9d; }
        
        @media (max-width: 1200px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🌸</div>
                <div class="brand-text">Gege</div>
            </div>
            <a href="index.html" class="nav-item">📊 Dashboard</a>
            <a href="tasks.html" class="nav-item">✓ Tasks</a>
            <a href="content.html" class="nav-item">📝 Content</a>
            <a href="calendar.html" class="nav-item active">📅 Calendar</a>
            <a href="memory.html" class="nav-item">🧠 Memory</a>
            <a href="team.html" class="nav-item">👥 Team</a>
            <a href="office.html" class="nav-item">🏢 Office</a>
        </aside>

        <main class="main">
            <div class="header">
                <h1 class="header-title">February 2025</h1>
                <div>
                    <button class="btn">←</button>
                    <button class="btn">→</button>
                </div>
            </div>

            <div class="calendar-container">
                <div class="cal-header">
                    <div class="cal-header-cell">Mon</div>
                    <div class="cal-header-cell">Tue</div>
                    <div class="cal-header-cell">Wed</div>
                    <div class="cal-header-cell">Thu</div>
                    <div class="cal-header-cell">Fri</div>
                    <div class="cal-header-cell">Sat</div>
                    <div class="cal-header-cell">Sun</div>
                </div>
                
                <div class="cal-grid">
                    <div class="cal-day other"><div class="cal-day-num">27</div></div>
                    <div class="cal-day other"><div class="cal-day-num">28</div></div>
                    <div class="cal-day other"><div class="cal-day-num">29</div></div>
                    <div class="cal-day other"><div class="cal-day-num">30</div></div>
                    <div class="cal-day other"><div class="cal-day-num">31</div></div>
                    <div class="cal-day"><div class="cal-day-num">1</div></div>
                    <div class="cal-day"><div class="cal-day-num">2</div></div>

                    <div class="cal-day"><div class="cal-day-num">3</div></div>
                    <div class="cal-day"><div class="cal-day-num">4</div></div>
                    <div class="cal-day"><div class="cal-day-num">5</div></div>
                    <div class="cal-day"><div class="cal-day-num">6</div></div>
                    <div class="cal-day"><div class="cal-day-num">7</div></div>
                    <div class="cal-day"><div class="cal-day-num">8</div></div>
                    <div class="cal-day"><div class="cal-day-num">9</div></div>

                    <div class="cal-day"><div class="cal-day-num">10</div></div>
                    <div class="cal-day"><div class="cal-day-num">11</div></div>
                    <div class="cal-day"><div class="cal-day-num">12</div></div>
                    <div class="cal-day"><div class="cal-day-num">13</div></div>
                    <div class="cal-day"><div class="cal-day-num">14</div></div>
                    <div class="cal-day"><div class="cal-day-num">15</div></div>
                    <div class="cal-day"><div class="cal-day-num">16</div></div>

                    <div class="cal-day"><div class="cal-day-num">17</div></div>
                    <div class="cal-day"><div class="cal-day-num">18</div></div>
                    <div class="cal-day today">
                        <div class="cal-day-num">19</div>
                        <div class="cal-event ev-cron">🤖 Daily check</div>
                        <div class="cal-event ev-task">✓ Mission Control</div>
                    </div>
                    <div class="cal-day"><div class="cal-day-num">20</div></div>
                    <div class="cal-day"><div class="cal-day-num">21</div></div>
                    <div class="cal-day"><div class="cal-day-num">22</div></div>
                    <div class="cal-day"><div class="cal-day-num">23</div></div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
