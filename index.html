<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Gege Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #000; 
            color: #fff; 
            min-height: 100vh;
        }
        
        /* Layout */
        .app { 
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar { 
            width: 260px;
            background: #0a0a0a;
            border-right: 1px solid rgba(255,255,255,0.06);
            padding: 32px 20px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
        }
        
        .brand { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 40px;
            padding-left: 8px;
        }
        
        .brand-icon { 
            font-size: 1.5rem;
        }
        
        .brand-text { 
            font-size: 1.5rem; 
            font-weight: 700;
            background: linear-gradient(135deg, #ffb3c1, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .nav-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 12px 16px; 
            border-radius: 12px; 
            color: #888; 
            text-decoration: none; 
            margin-bottom: 4px; 
            font-size: 0.9375rem;
            transition: all 0.2s;
        }
        
        .nav-item:hover { 
            background: rgba(255,255,255,0.03); 
            color: #fff; 
        }
        
        .nav-item.active { 
            background: rgba(255,107,157,0.15); 
            color: #ffb3c1; 
        }
        
        /* Main Content */
        .main { 
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            min-height: 100vh;
        }
        
        .header { 
            margin-bottom: 32px;
        }
        
        .header-title { 
            font-size: 2.5rem; 
            font-weight: 700;
            margin-bottom: 24px;
            line-height: 1.2;
        }
        
        .header-time {
            font-size: 1.25rem;
            color: #fff;
            font-weight: 500;
        }
        
        /* Stats Grid */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 24px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 28px;
            min-height: 140px;
        }
        
        .stat-value { 
            font-size: 3rem; 
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .stat-label { 
            color: #666; 
            font-size: 0.9375rem;
        }
        
        @media (max-width: 1200px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 24px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-icon">🌸</span>
                <span class="brand-text">Gege</span>
            </div>
            
            <a href="index.html" class="nav-item active">📊 Dashboard</a>
            <a href="tasks.html" class="nav-item">✓ Tasks</a>
            <a href="content.html" class="nav-item">📝 Content</a>
            <a href="calendar.html" class="nav-item">📅 Calendar</a>
            <a href="memory.html" class="nav-item">🧠 Memory</a>
            <a href="team.html" class="nav-item">👥 Team</a>
            <a href="office.html" class="nav-item">🏢 Office</a>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <div class="header">
                <h1 class="header-title">Mission Control</h1>
                <div class="header-time" id="clock">--:--</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-tasks">4</div>
                    <div class="stat-label">Active Tasks</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-value" id="stat-content">12</div>
                    <div class="stat-label">Content Pieces</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-value">3</div>
                    <div class="stat-label">Team Agents</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-value">87</div>
                    <div class="stat-label">Memories</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Live Clock
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
            document.getElementById('clock').textContent = timeString;
        }
        
        setInterval(updateClock, 1000);
        updateClock();
        
        // Load stats from localStorage
        function updateStats() {
            const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            const content = JSON.parse(localStorage.getItem('content') || '[]');
            
            document.getElementById('stat-tasks').textContent = tasks.filter(t => t.status !== 'done').length || 4;
            document.getElementById('stat-content').textContent = content.length || 12;
        }
        
        updateStats();
    </script>
</body>
</html>
