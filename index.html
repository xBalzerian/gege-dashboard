<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gege Panel</title>
<style>
body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;margin:0;padding:20px}
.container{max-width:900px;margin:0 auto}
.header{background:linear-gradient(90deg,#00d4ff,#7b2cbf);padding:30px;border-radius:12px;margin-bottom:20px}
h1{margin:0}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{background:#1a1a1a;border:none;color:#fff;padding:15px 25px;border-radius:8px;cursor:pointer}
.tab.active{background:#00d4ff;color:#000}
.card{background:#1a1a1a;border-radius:12px;padding:25px;margin-bottom:15px}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333}
.row:last-child{border:none}
.label{color:#888}
.val{color:#fff;font-weight:bold}
.green{color:#00ff88}
.hide{display:none}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>🦾 Gege Panel</h1><p>System Online | Feb 18, 2026</p></div>
<div class="tabs">
<button class="tab active" onclick="s('c')">Clients</button>
<button class="tab" onclick="s('k')">Skills</button>
<button class="tab" onclick="s('a')">Agents</button>
<button class="tab" onclick="s('m')">Memory</button>
</div>
<div id="c"><div class="card"><div class="row"><span class="label">Client</span><span class="val">TranPlastic Surgery</span></div><div class="row"><span class="label">Website</span><span class="val">tranplastic.com</span></div><div class="row"><span class="label">Services</span><span class="val">30 Completed</span></div><div class="row"><span class="label">Status</span><span class="val green">100% Complete</span></div></div></div>
<div id="k" class="hide"><div class="card"><div class="row"><span class="label">Content Generator</span><span class="val green">Active</span></div><div class="row"><span class="label">Image Generator</span><span class="val green">Active</span></div><div class="row"><span class="label">WP AutoPost</span><span class="val green">Active</span></div></div></div>
<div id="a" class="hide"><div class="card"><div class="row"><span class="label">Kimi Claw</span><span class="val green">Online</span></div><div class="row"><span class="label">Content Agent</span><span class="val">Standby</span></div></div></div>
<div id="m" class="hide"><div class="card"><div class="row"><span class="label">Feb 18, 6:30 PM</span><span class="val">Completed 30 pages</span></div></div></div>
</div>
<script>function s(id){document.querySelectorAll('.card').forEach(c=>c.parentElement.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active')}</script>
</body>
</html>
