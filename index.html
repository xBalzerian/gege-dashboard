<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Gege Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
        
        /* Layout */
        .app { display: grid; grid-template-columns: 260px 1fr; }
        .sidebar { background: rgba(20,20,28,0.9); border-right: 1px solid rgba(255,255,255,0.06); padding: 24px 20px; position: fixed; left: 0; top: 0; bottom: 0; width: 260px; }
        .main { margin-left: 260px; padding: 32px; }
        
        /* Brand */
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .brand-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #ff6b9d, #ff8fab); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .brand-text { font-size: 1.5rem; font-weight: 700; }
        
        /* Nav */
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; color: #888; text-decoration: none; margin-bottom: 4px; transition: all 0.2s; }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .nav-item.active { background: rgba(255,107,157,0.15); color: #ffb3c1; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header-title { font-size: 1.75rem; font-weight: 700; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #ff6b9d, transparent);
        }
        
        .stat-value { font-size: 2.5rem; font-weight: 800; margin-bottom: 4px; background: linear-gradient(135deg, #fff, #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-label { color: #888; font-size: 0.875rem; }
        .stat-delta { color: #00d9a3; font-size: 0.8125rem; margin-top: 8px; font-weight: 600; }
        
        @media (max-width: 1200px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🌸</div>
                <div class="brand-text">Gege</div>
            </div>
            <a href="index.html" class="nav-item active">📊 Dashboard</a>
            <a href="tasks.html" class="nav-item">✓ Tasks</a>
            <a href="content.html" class="nav-item">📝 Content</a>
            <a href="calendar.html" class="nav-item">📅 Calendar</a>
            <a href="memory.html" class="nav-item">🧠 Memory</a>
            <a href="team.html" class="nav-item">👥 Team</a>
            <a href="office.html" class="nav-item">🏢 Office</a>
        </aside>

        <main class="main">
            <div class="header">
                <h1 class="header-title">Dashboard</h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value">4</div>
                    <div class="stat-label">Active Tasks</div>
                    <div class="stat-delta">↑ 2 today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">12</div>
                    <div class="stat-label">Content Pieces</div>
                    <div class="stat-delta">↑ 3 this week</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">3</div>
                    <div class="stat-label">Team Agents</div>
                    <div class="stat-delta">All online</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">87</div>
                    <div class="stat-label">Memories</div>
                    <div class="stat-delta">↑ 5 new</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
